# Seeed Studio ReSpeaker Lite board (XMOS XU316 + XIAO ESP32-S3).
# Adapted from the Seeed Studio Wiki page "Voice Assistant System for Home
# Assistant reSpeaker Lite" (https://wiki.seeedstudio.com/respeaker_lite_ha/),
# which credits FormatBCE for the original YAML
# (https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration).
# Code examples embedded in the Seeed wiki are MIT licensed
# (https://wiki.seeedstudio.com/License/) - keep this attribution when reusing.
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
psram:
  mode: octal
  speed: 80MHz
