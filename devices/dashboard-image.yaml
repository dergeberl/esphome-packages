substitutions:
  device_name: device-name
  friendly_name: "Friendly Name"
  ha_image_url_entity: "input_text.dashboard_image_url"
  refresh_interval: "60s"
  deepsleep_default_duration: "180min"
  deepsleep_duration_min: "1"
  deepsleep_duration_max: "10080"
  deepsleep_duration_initial: "180"
esphome:
  on_boot:
    - priority: 200
      then:
        - script.execute: update_display
deep_sleep:
  id: deep
  sleep_duration: ${deepsleep_default_duration}
  wakeup_pin:
    number: GPIO4
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP
globals:
  - id: image_url
    type: std::string
    restore_value: yes
    storage: flash
    max_restore_data_length: 254
    initial_value: '""'
text_sensor:
  - platform: homeassistant
    id: ha_image_url
    entity_id: ${ha_image_url_entity}
    internal: true
    on_value:
      - lambda: |-
          id(image_url) = x;
      - online_image.set_url:
          id: dashboard_image
          url: !lambda 'return id(image_url);'
          update: false
      - script.execute: update_display
number:
  - platform: template
    name: "${friendly_name} Deep sleep duration"
    id: deepsleep_duration
    entity_category: config
    icon: "mdi:sleep"
    unit_of_measurement: "min"
    min_value: ${deepsleep_duration_min}
    max_value: ${deepsleep_duration_max}
    step: 1
    initial_value: ${deepsleep_duration_initial}
    optimistic: true
    restore_value: true
button:
  - platform: template
    name: "${friendly_name} Deep sleep"
    id: deepsleep_button
    entity_category: config
    icon: "mdi:sleep"
    on_press:
      - delay: 1s
      - deep_sleep.enter:
          id: deep
          sleep_duration: !lambda 'return (uint32_t)(id(deepsleep_duration).state * 60000.0f);'
  - platform: template
    name: "${friendly_name} Refresh display"
    id: refresh_image
    icon: "mdi:image-frame"
    on_press:
      - script.execute: update_display
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    id: button_green
    on_press:
      - script.execute: update_display
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      allow_other_uses: true
      inverted: true
    internal: true
    id: button_right
    on_press:
      then:
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    id: button_left
    on_press:
      then:
psram:
  mode: octal
  speed: 80MHz
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
http_request:
  verify_ssl: false
  timeout: 20s
  watchdog_timeout: 25s
image:
  - id: dashboard_image
    platform: online_image
    format: ${image_format}
    type: ${image_type}
    buffer_size: 65536
    url: "http://placeholder.invalid/image"
    on_download_finished:
      then:
        - component.update: epaper_display
        - component.update: esphome_uptime
script:
  - id: update_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(image_url).empty();'
          then:
            - component.update: dashboard_image
            - delay: ${refresh_interval}
            - script.execute: update_display
