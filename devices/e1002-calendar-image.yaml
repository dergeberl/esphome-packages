substitutions:
  device_name: device-name
  friendly_name: "Friendly Name"
  calendar_url: "http://puppet.local:8080/calendar.png"
  refresh_interval_min: "30"
  night_mode_enabled: "true"
  night_start_hour: "22"
  night_end_hour: "7"
  deepsleep_run_duration: "5min"
esphome:
  project:
    name: "dergeberl.e1002-calendar-image"
    version: "v0.0.0"
  on_boot:
    - priority: 200
      then:
        - script.execute: update_display
globals:
  - id: sleep_time
    type: int
    restore_value: no
    initial_value: '${refresh_interval_min}'
deep_sleep:
  id: deep
  run_duration: ${deepsleep_run_duration}
  sleep_duration: ${refresh_interval_min}min
  wakeup_pin:
    number: GPIO4
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP
switch:
  - platform: template
    entity_category: config
    name: "${friendly_name} OTA"
    id: ota_switch
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - deep_sleep.prevent: deep
      - display.page.show: otaview
      - script.execute: update_display
    turn_off_action:
      - display.page.show: calendar
      - script.execute: update_display
      - delay: 1s
      - deep_sleep.allow: deep
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    id: button_green
    on_press:
      then:
        - switch.toggle: ota_switch
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      allow_other_uses: true
      inverted: true
    internal: true
    id: button_right
    on_press:
      then:
        - script.execute: update_display
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    id: button_left
    on_press:
      then:
        - script.execute: update_display
psram:
  mode: octal
  speed: 80MHz
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
http_request:
  verify_ssl: false
  timeout: 20s
  watchdog_timeout: 25s
image:
  - platform: online_image
    id: calendar_image
    format: PNG
    type: RGB565
    buffer_size: 65536
    url: "${calendar_url}"
    on_download_finished:
      then:
        - component.update: epaper_display
        - component.update: esphome_uptime
        - delay: 1s
        - script.execute: deepsleep_if_possible
    on_error:
      then:
        - delay: 1s
        - script.execute: deepsleep_if_possible
font:
  - file: "gfonts://Roboto"
    id: roboto_15
    size: 15
  - file: "gfonts://Roboto"
    id: roboto_50
    size: 50
  - file:
      type: gfonts
      family: Material Symbols Outlined
      weight: 500
    id: icons_100
    size: 100
    glyphs: ["\ue923"]
display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    pages:
      - id: calendar
        lambda: |-
          it.image(0, 0, id(calendar_image));
          it.filled_rectangle(0, 458, 800, 22, Color::WHITE);
          it.strftime(10, 460, id(roboto_15), "%d.%m.%y %H:%M", id(homeassistant_time).now());
          it.printf(790, 460, id(roboto_15), TextAlign::TOP_RIGHT, "%.0f%%", id(battery_level).state);
      - id: otaview
        lambda: |-
          it.print(400, 30, id(icons_100), TextAlign::TOP_CENTER, "\U0000e923");
          it.print(400, 230, id(roboto_50), TextAlign::TOP_CENTER, "OTA is enabled");
button:
  - platform: template
    name: "${friendly_name} Refresh display"
    id: refresh_image
    icon: "mdi:image-frame"
    on_press:
      - script.execute: update_display
script:
  - id: update_display
    mode: restart
    then:
      - component.update: battery_voltage
      - component.update: battery_level
      - wait_until:
          timeout: 15s
          condition:
            - api.connected:
      - wait_until:
          timeout: 15s
          condition:
            - time.has_time:
      - component.update: calendar_image
      - delay: 60s
      - script.execute: update_display
  - id: calculate_sleep_time
    mode: restart
    then:
      - lambda: |-
          if (!id(homeassistant_time).now().is_valid()) {
            id(sleep_time) = ${refresh_interval_min};
            return;
          }
          int hour = id(homeassistant_time).now().hour;
          int minute = id(homeassistant_time).now().minute;
          bool night = (hour >= ${night_start_hour}) || (hour < ${night_end_hour});
          if (${night_mode_enabled} && night) {
            int minutes_until_end = ((${night_end_hour} - hour + 24) % 24) * 60 - minute;
            id(sleep_time) = minutes_until_end < 1 ? 24 * 60 : minutes_until_end;
          } else {
            id(sleep_time) = ${refresh_interval_min};
          }
  - id: deepsleep_if_possible
    mode: restart
    then:
      - if:
          condition:
            - switch.is_on: ota_switch
          then:
            - script.stop: deepsleep_if_possible
      - script.execute: calculate_sleep_time
      - deep_sleep.enter:
          id: deep
          sleep_duration: !lambda |-
            return id(sleep_time) * 60000;
