substitutions:
  image_format: "PNG"
  image_type: "RGB565"
esphome:
  project:
    name: "dergeberl.e1002-dashboard-image"
    version: "v0.0.0"
display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image));
      it.strftime(10, 460, id(roboto_15), Color(0, 0, 0, 0), "%d.%m.%y %H:%M", id(homeassistant_time).now());
